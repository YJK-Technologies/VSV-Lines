<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A33" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99A27" />
      <stop offset="100%" stop-color="#E5AC43" />
    </linearGradient>
  </defs>
  <!-- Background Shield / Hexagon -->
  <rect width="64" height="64" rx="14" fill="url(#navyGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Subtle Latitude Arc -->
  <path d="M12 32 C 22 24, 42 24, 52 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M14 42 C 24 34, 40 34, 50 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
  
  <!-- Stylized VSV Monogram & Vessel Bow -->
  <!-- Container Box Element -->
  <polygon points="32,13 46,20 32,27 18,20" fill="url(#goldGrad)" />
  <polygon points="18,21 32,28 32,36 18,29" fill="#C2871A" />
  <polygon points="46,21 32,28 32,36 46,29" fill="#E5AC43" />
  
  <!-- Vessel Hull / Dynamic Ocean Waves Formed by VSV Flow -->
  <path d="M14 38 L32 51 L50 38 L43 45 L32 54 L21 45 Z" fill="url(#goldGrad)" />
  <!-- Monogram Letter Cuts -->
  <path d="M22 27 L28 41 L32 33 L36 41 L42 27" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
